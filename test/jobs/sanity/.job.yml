    repo-dependencies:
      /common-infra-operator:
        repository: https://github.com/pensando/common-infra-operator
        reference: ea87427f1574ca3fa12e4933353fb39aedc6c440
    resources:
    - generic:
      - type: GPUOP-Cluster
        vendor: Pensando
        count: 1
        props:
          - name: testbed-type
            value: K8

  exporter-debian-pytest-sanity-inbox-driver:
