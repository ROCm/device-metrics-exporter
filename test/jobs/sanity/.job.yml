         /common-infra-operator/ci-internal/run_sanity.sh --app docker \
         --registry direct --testbed /warmd.json --amdgpu-driver inbox"
    ]
    owners: ["email:srivatsa.sangli@amd.com"]
    tcp-ports: [5000]
    area:
    sub-area:
    build-dependencies:
      - build-device-metrics-exporter-gpu
    repo-dependencies:
      /common-infra-operator:
        repository: https://github.com/pensando/common-infra-operator
        reference: ea87427f1574ca3fa12e4933353fb39aedc6c440
    resources:
    - generic:
      - type: GPUOP-Cluster
        vendor: Pensando
