name: DME Pre-Release Build

# Builds DME + test-runner images, .deb packages, and Helm chart against a ROCm tarball.
# Provide dme_version (e.g. v1.5.3) and rocm_version (e.g. 10.1.0rc4 or 10.1.0).
# When rocm_version contains rc (e.g. 10.1.0rc4), uses rc.repo.amd.com.
# When rocm_version has no rc suffix (e.g. 10.1.0), uses stable.repo.amd.com (GA build).
# Artifacts land at: device-metrics-exporter/pre-release/{dme_version}-{rocm_version}-{N}/
# Image tag format:  {dme_version}-{rocm_version}-{N}  e.g. v1.5.3-10.1.0rc4-1
# DME image is pushed to rocm/device-metrics-exporter with that same tag.
#
# Builds run from a release-vX.Y.Z branch only (branch-guard). The daily schedule runs only the
# watch job on main, which dispatches this workflow on the latest release branch.
#
# Job graph: watch (schedule) | branch-guard → resolve → build-dme + build-test-runner + build-helm → publish → results

on:
  schedule:
    - cron: '41 8 * * *'

  workflow_dispatch:
    inputs:
      dme_version:
        description: 'DME version (e.g. v1.5.3)'
        required: true
        type: string
      rocm_version:
        description: 'ROCm version (e.g. 10.1.0rc4 for RC build, or 10.1.0 for GA build)'
        required: true
        type: string
      force_rebuild:
        description: 'Force rebuild even if already built for this tarball + SHA'
        required: false
        type: boolean
        default: false

# Keep this derived from inputs: the scheduled watch run has empty inputs, so it never shares a
# group with the dispatched build it starts (an event-independent group would deadlock it).
concurrency:
  group: dme-prerelease-${{ inputs.dme_version }}-${{ inputs.rocm_version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  watch:
    name: Watch
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch build for latest release branch + ROCm RC
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RC_CDN="https://rc.repo.amd.com/rocm/core/tarball"

          BRANCH=$(gh api "repos/${REPO}/git/matching-refs/heads/release-v" --paginate --jq '.[].ref' \
            | sed 's#^refs/heads/##' \
            | grep -E '^release-v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -z "${BRANCH}" ]; then
            echo "::error::No release-vX.Y.Z branch found"
            exit 1
          fi

          MAKEFILE=$(gh api "repos/${REPO}/contents/Makefile?ref=${BRANCH}" --jq '.content' | base64 -d)
          read_var() {
            printf '%s\n' "${MAKEFILE}" \
              | grep -m1 -E "^$1[[:space:]]*\?=" \
              | sed -E 's/^[^=]*=[[:space:]]*//; s/[[:space:]]*#.*$//; s/[[:space:]]+$//' \
              | tr -d '"\r' || true
          }
          VERSION=$(read_var PROJECT_VERSION)
          ROCM_LINE=$(read_var ROCM_VERSION)
          echo "::notice::${BRANCH}: PROJECT_VERSION=${VERSION:-EMPTY} ROCM_VERSION=${ROCM_LINE:-EMPTY}"
          if [ "${VERSION}" != "v${BRANCH#release-v}" ]; then
            echo "::error::PROJECT_VERSION '${VERSION}' does not match branch ${BRANCH}"
            exit 1
          fi
          if ! [[ "${ROCM_LINE}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ROCM_VERSION '${ROCM_LINE}' on ${BRANCH} is not X.Y.Z"
            exit 1
          fi

          # Nothing between "multiarch-" and the version, so the multiarch-tests-* tarballs never match
          INDEX=$(curl -fsSL --retry 3 "${RC_CDN}/")
          ESC="${ROCM_LINE//./\\.}"
          ROCM_RC=$(printf '%s\n' "${INDEX}" \
            | grep -oE "therock-dist-linux-multiarch-${ESC}rc[0-9]+\.tar\.gz" \
            | sort -u \
            | sed -E 's/^therock-dist-linux-multiarch-//; s/\.tar\.gz$//' \
            | sed -E 's/.*rc([0-9]+)$/\1 &/' \
            | sort -n | tail -1 | awk '{print $2}' || true)
          if [ -z "${ROCM_RC}" ]; then
            echo "::notice::No ${ROCM_LINE}rcN tarball published yet; nothing to build"
            exit 0
          fi

          HTTP_CODE=$(curl -sSI -o /dev/null -w '%{http_code}' --retry 3 \
            "${RC_CDN}/therock-dist-linux-multiarch-${ROCM_RC}.tar.gz" || echo 000)
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::warning::${ROCM_RC} tarball returned HTTP ${HTTP_CODE}; not dispatching"
            exit 0
          fi

          # rocm-resolve in the dispatched run skips the build if this RC + branch head SHA was already built
          gh workflow run rocm-prerelease-build.yml --repo "${REPO}" --ref "${BRANCH}" \
            -f dme_version="${VERSION}" -f rocm_version="${ROCM_RC}"

          {
            echo "## DME Pre-Release Watch"
            echo ""
            echo "Dispatched \`rocm-prerelease-build.yml\` on \`${BRANCH}\`: dme_version \`${VERSION}\`, rocm_version \`${ROCM_RC}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  branch-guard:
    name: Require release branch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless running on a release-vX.Y.Z branch
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" != "branch" ] || ! [[ "${REF_NAME}" =~ ^release-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Pre-release builds must run from a release-vX.Y.Z branch, not '${REF_NAME}'. Use: gh workflow run rocm-prerelease-build.yml --ref release-vX.Y.Z ..."
            exit 1
          fi
          echo "::notice::Running on release branch ${REF_NAME}"

  resolve:
    name: Resolve
    needs: branch-guard
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ROCm/common-infra-operator/.github/workflows/rocm-resolve.yml@9c6a249c7abb8bda28b2940dbb536e22e56f3dce
    with:
      component: dme
      version: ${{ inputs.dme_version }}
      rocm_version: ${{ inputs.rocm_version }}
      s3_component_prefix: device-metrics-exporter
      s3_bucket: ${{ vars.THEROCK_BUCKET_NAME }}
      trigger_event: pre-release
      trigger_sha: ${{ github.sha }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}

  build-dme:
    name: Build DME
    needs: resolve
    permissions:
      contents: read
      actions: write
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/_build-dme.yml
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      rocm_tarball_url: ${{ needs.resolve.outputs.rocm_tarball_url }}
      version: ${{ needs.resolve.outputs.version }}
      suffix: ${{ needs.resolve.outputs.suffix }}

  build-test-runner:
    name: Build Test Runner
    needs: resolve
    permissions:
      contents: read
      actions: write
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/_build-test-runner.yml
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      rocm_tarball_url: ${{ needs.resolve.outputs.rocm_tarball_url }}
      version: ${{ needs.resolve.outputs.version }}
      suffix: ${{ needs.resolve.outputs.suffix }}

  build-helm:
    name: Build Helm Chart
    needs: resolve
    permissions:
      contents: read
      actions: write
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/_build-helm.yml
    with:
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      version: ${{ needs.resolve.outputs.version }}
      suffix: ${{ needs.resolve.outputs.suffix }}

  publish:
    name: Publish
    needs: [resolve, build-dme, build-test-runner, build-helm]
    permissions:
      contents: read
      id-token: write
      actions: write
    if: >-
      always() && needs.resolve.outputs.build_needed == 'true'
      && (needs.build-dme.result == 'success'
      || needs.build-test-runner.result == 'success'
      || needs.build-helm.result == 'success')
    uses: ROCm/common-infra-operator/.github/workflows/rocm-publish.yml@9c6a249c7abb8bda28b2940dbb536e22e56f3dce
    with:
      component: dme
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      rocm_tarball_version: ${{ needs.resolve.outputs.rocm_tarball_version }}
      all_builds_succeeded: ${{ needs.build-dme.result == 'success' && needs.build-test-runner.result == 'success' && needs.build-helm.result == 'success' }}
      version:   ${{ needs.resolve.outputs.version }}
      suffix:    ${{ needs.resolve.outputs.suffix }}
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}
      trigger_sha: ${{ github.sha }}
      s3_bucket: ${{ vars.THEROCK_BUCKET_NAME }}
      artifact_names: >-
        build-dme-${{ needs.resolve.outputs.image_tag }},
        build-test-runner-${{ needs.resolve.outputs.image_tag }},
        build-helm-${{ needs.resolve.outputs.image_tag }}
      s3_file_globs: "*.tar.gz,*_amd64.deb,*.tgz"
      docker_images: |
        device-metrics-exporter-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}.tar.gz|rocm/device-metrics-exporter:${{ needs.resolve.outputs.image_tag }}|amdpsdo/device-metrics-exporter:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}|true
        device-metrics-exporter-sriov-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}.tar.gz|rocm/device-metrics-exporter-sriov:${{ needs.resolve.outputs.image_tag }}|amdpsdo/device-metrics-exporter-sriov:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}|true
        test-runner-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}.tar.gz|rocm/test-runner:${{ needs.resolve.outputs.image_tag }}|amdpsdo/test-runner:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}|true
        device-metrics-exporter-${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}.tar.gz|rocm/device-metrics-exporter:${{ needs.resolve.outputs.image_tag }}|rocm/device-metrics-exporter:${{ needs.resolve.outputs.image_tag }}|true
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}
      DOCKER_TOKEN:      ${{ secrets.DOCKER_TOKEN }}
      DOCKER_USERNAME:   ${{ vars.DOCKER_USERNAME }}

  results:
    name: Results
    needs: [resolve, build-dme, build-test-runner, build-helm, publish]
    if: always() && needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Post summary
        env:
          IMAGE_TAG:          ${{ needs.resolve.outputs.image_tag }}
          VERSION:            ${{ needs.resolve.outputs.version }}
          SUFFIX:             ${{ needs.resolve.outputs.suffix }}
          S3_PREFIX:          ${{ needs.resolve.outputs.s3_prefix }}
          S3_BUCKET:          ${{ vars.THEROCK_BUCKET_NAME }}
          DME_RESULT:         ${{ needs.build-dme.result }}
          TEST_RUNNER_RESULT: ${{ needs.build-test-runner.result }}
          HELM_RESULT:        ${{ needs.build-helm.result }}
          PUBLISH_RESULT:     ${{ needs.publish.result }}
        run: |
          {
            echo "## DME Pre-Release Build Results"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Suffix | \`${SUFFIX}\` |"
            echo "| Build DME | ${DME_RESULT} |"
            echo "| Build Test Runner | ${TEST_RUNNER_RESULT} |"
            echo "| Build Helm | ${HELM_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            [ -n "${S3_PREFIX}" ] && echo "| S3 location | \`s3://${S3_BUCKET}/${S3_PREFIX}/\` |" || true
          } >> "$GITHUB_STEP_SUMMARY"
